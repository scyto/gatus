# Builds this fork's image and publishes it to ghcr.io/scyto/gatus.
#
# WHY THIS FORK EXISTS
#
# Gatus substitutes ${VAR} in its configuration from the environment. On Docker
# Swarm there is no way to get a secret into an environment variable: Swarm
# secrets are files, and the usual workaround -- an entrypoint that exports
# from /run/secrets -- cannot be used because the upstream image is distroless
# and has no shell.
#
# So a Swarm deployment has to put credentials in the service spec, readable by
# anything that can reach the Docker API. This fork adds ${VAR}_FILE, so the
# value comes from a file instead. See TwiN/gatus#690, #1399 and #1626.
#
# Tags are <upstream version>-secrets, e.g. v5.36.0-secrets, so it is obvious
# at a glance which upstream release a running image is based on -- and obvious
# that it is not stock.
name: publish-fork

on:
  push:
    tags:
      - "v*-secrets"
      - "v*-secrets-backup"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v5.36.0-secrets"
        required: true
      platforms:
        description: Platforms to build
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

jobs:
  publish-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Run the tests before publishing. The whole point of the fork is one
      # function in config.go; shipping it untested would be worse than not
      # forking at all.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./config/... -run TestParseAndValidateConfigBytes -v
          go test ./storage/store/sql/... -run 'Backup|UntilMinute|StartSQLite' -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Get image repository
        run: echo GHCR_IMAGE_REPOSITORY=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
